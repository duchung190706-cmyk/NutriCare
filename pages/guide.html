        <h2 class="guide-section-title" data-i18n="guide.featuredTitle"></h2>

            <div class="featured-icon">🍗</div>
            <div class="featured-title" id="featTitle1">Protein</div>
          </div>
          <div class="featured-card" data-id="g6">
            <div class="featured-icon">🍽️</div>

          </div>
          <div class="featured-card" data-id="g5">

            <div class="featured-title" id="featTitle3">Hydration</div>
          </div>

           MAIN CONTENT
      ============================================================ -->
      <div class="guide-main">

        <div class="guide-toolbar">
          <input type="text" id="guideSearch" class="guide-search" data-i18n-ph="guide.searchPh" />
          
          <select id="filterCat" class="guide-filter">
            <option value="all" data-i18n="guide.filterAll"></option>
            <option value="basics" data-i18n="guide.catBasics"></option>
            <option value="macros" data-i18n="guide.catMacros"></option>
            <option value="hydration" data-i18n="guide.catHydration"></option>
            <option value="meal-planning" data-i18n="guide.catMealPlanning"></option>
            <option value="habits" data-i18n="guide.catHabits"></option>
          </select>
        </div>

        <!-- GRID -->
        <div class="guide-grid" id="guideGrid"></div>
      </div>

    <div class="guide-modal" id="guideModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="guide-modal-header">

          <span class="guide-card-cat" id="modalCat" style="margin-bottom:0.25rem;"></span>

        </div>
        <button class="btn-modal-close" id="btnModalClose" aria-label="Close modal" data-i18n-title="guide.btnClose">&times;</button>

      <div class="guide-modal-body">
        <!-- Content injected dynamically -->
        <div class="guide-modal-content" id="modalContent"></div>
